name: 更新行情資料

on:
  schedule:
    - cron: '47 21 * * 1-5'   # 台北 週二～週六 05:47（美股收盤後）
    - cron: '17 7 * * 1-5'    # 台北 週一～週五 15:17（台股收盤後）
  workflow_dispatch:            # Actions 頁面手動執行
  repository_dispatch:          # 外部觸發（例如 Cloudflare Worker），event_type = update-data
    types: [update-data]

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安裝套件
        run: pip install -r requirements.txt

      - name: 抓取並清理資料
        run: python backend/fetch_data.py

      - name: 提交資料
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "資料無變更"
          else
            git commit -m "data: 更新 $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
            git pull --rebase
            git push
          fi
